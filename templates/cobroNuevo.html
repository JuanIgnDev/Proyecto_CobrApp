{{define "contenido"}}
<main class="libro">
  <a href="/clientes/{{.Cliente.ID}}" class="link-volver">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    Volver a la ficha
  </a>

  {{if gt .Cliente.Saldo 0.0}}
  <div class="balance-hero debe">
    <span class="balance-label">Saldo antes de este cobro</span>
    <span class="balance-monto">${{printf "%.2f" .Cliente.Saldo}}</span>
  </div>
  {{end}} {{if .Error}}
  <p id="form-error" class="saldo debe mensaje-error">
    {{.Error}}
  </p>
  {{end}}

  <form
    method="POST"
    action="/clientes/{{.Cliente.ID}}/cobro_nuevo"
    class="form-cliente"
  >
    <label for="monto">Total</label>
    <input
      type="text"
      inputmode="decimal"
      id="monto"
      name="monto"
      class="input-moneda"
      placeholder="0,00"
      autocomplete="off"
      required
      autofocus
    />

    <label for="observacion">Observación</label>
    <input
      type="text"
      id="observacion"
      name="observacion"
      placeholder="Ej: Cobro parcial en efectivo"
    />

    <label for="fecha">Fecha (opcional, si no se completa se usa hoy)</label>
    <input type="date" id="fecha" name="fecha" />

    <div class="form-acciones">
      <button
        class="btn-cancelar"
        type="button"
        onclick="location.href = '/clientes/{{.Cliente.ID}}'"
      >
        Cancelar
      </button>
      <button type="submit" class="btn-nuevo btn-pagar">Registrar Cobro</button>
    </div>
  </form>
</main>
{{end}}
