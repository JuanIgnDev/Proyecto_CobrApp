{{define "contenido"}}
<div class="form-contenedor-estrecho">
  {{if .Error}}
  <p id="form-error" class="saldo debe mensaje-error">
    {{.Error}}
  </p>
  {{end}}

  <form method="POST" action="/cliente_nuevo" class="form-cliente form-grid">
    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Nombre/s"
      autocomplete="off"
      required
    />
    <input
      type="text"
      id="apellido"
      name="apellido"
      placeholder="Apellido/s"
      autocomplete="off"
      required
    />

    <input
      type="tel"
      id="telefono"
      name="telefono"
      placeholder="Teléfono (opcional)"
      autocomplete="off"
    />
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Email (opcional)"
      autocomplete="off"
    />

    <div class="form-acciones">
      <button
        class="btn-secundario"
        type="button"
        onclick="location.href = '/'"
      >
        Cancelar
      </button>
      <button class="btn-primario" type="submit">
        Guardar Cliente
      </button>
    </div>
  </form>
</div>
{{end}}
