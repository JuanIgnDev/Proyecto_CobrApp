{{define "contenido"}}
<div class="form-contenedor-estrecho">
  {{if .Error}}
  <div id="form-error" class="form-error-wrap">
    <span class="saldo debe error-pill">
      {{.Error}}
    </span>
  </div>
  {{end}}

  <form method="POST" action="/cliente_nuevo" class="form-cliente form-grid">
    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Nombre/s"
      autocomplete="off"
      required
    />
    <input
      type="text"
      id="apellido"
      name="apellido"
      placeholder="Apellido/s"
      autocomplete="off"
      required
    />

    <input
      type="tel"
      id="telefono"
      name="telefono"
      placeholder="Teléfono (opcional)"
      autocomplete="off"
    />
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Email (opcional)"
      autocomplete="off"
    />

    <div class="form-acciones-grid">
      <button class="btn-nuevo btn-hover-green" type="submit">
        + Agregar Cliente
      </button>
      <button
        class="btn-nuevo btn-hover-red"
        type="button"
        onclick="location.href = '/'"
      >
        - Cancelar
      </button>
    </div>
  </form>
</div>
{{end}}
