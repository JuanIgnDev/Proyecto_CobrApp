{{define "contenido"}}
<main class="libro">
  <a href="/clientes/{{.Venta.ClienteID}}" class="btn-cancelar btn-volver"
    >&larr; Volver a la ficha</a
  >

  {{if .Error}}
  <p id="form-error" class="saldo debe mensaje-error">{{.Error}}</p>
  {{end}}

  <form
    method="POST"
    action="/venta/{{.Venta.ID}}/modificar"
    class="form-cliente"
  >
    <label for="total">Total</label>
    <input
      type="text"
      inputmode="decimal"
      id="total"
      name="total"
      class="input-moneda"
      placeholder="0,00"
      autocomplete="off"
      value="{{.Venta.Total}}"
      required
      autofocus
    />

    <label for="descripcion">Descripción</label>
    <input
      type="text"
      id="descripcion"
      name="descripcion"
      placeholder="Ej: 2 kg de harina"
      value="{{.Venta.Descripcion}}"
    />

    <label for="fecha">Fecha (si se deja vacío, se usa la fecha de hoy)</label>
    <input type="date" id="fecha" name="fecha" value="{{slice .Venta.Fecha 0 10}}" />

    <div class="form-acciones">
      <button type="submit" class="btn-nuevo btn-pagar">Modificar venta</button>
      <button
        class="btn-nuevo"
        type="button"
        onclick="location.href = '/clientes/{{.Venta.ClienteID}}'"
      >
        Cancelar
      </button>
    </div>
  </form>
</main>
{{end}}
