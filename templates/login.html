{{define "acciones-header"}}
<p></p>
{{end}} {{define "contenido"}}
<div class="login-wrap">
  {{if .Error}}
  <p class="saldo debe" style="display: block; margin-bottom: 1rem">
    {{.Error}}
  </p>
  {{end}}

  <form method="POST" action="/login" class="form-cliente">
    <label for="usuario">Usuario</label>
    <input
      type="text"
      id="usuario"
      name="usuario"
      required
      autofocus
      autocomplete="username"
    />

    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      autocomplete="current-password"
    />

    <div class="form-acciones">
      <button type="submit" class="btn-nuevo">Ingresar</button>
    </div>
  </form>
</div>
{{end}}
