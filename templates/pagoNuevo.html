{{define "contenido"}}
<main class="libro">
  <a
    href="/clientes/{{.Cliente.ID}}"
    class="btn-cancelar"
    style="display: inline-block; margin-bottom: 1rem"
    >&larr; Volver a la ficha</a
  >

  {{if gt .Cliente.Saldo 0.0}}
  <div class="balance-hero debe" style="margin-bottom: 1.4rem">
    <span class="balance-label">Saldo antes de este pago</span>
    <span class="balance-monto">${{printf "%.2f" .Cliente.Saldo}}</span>
  </div>
  {{end}} {{if .Error}}
  <p class="saldo debe" style="display: block; margin-bottom: 1rem">
    {{.Error}}
  </p>
  {{end}}

  <form
    method="POST"
    action="/clientes/{{.Cliente.ID}}/pago_nuevo"
    class="form-cliente"
  >
    <label for="monto">Monto</label>
    <input
      type="number"
      id="monto"
      name="monto"
      step="0.01"
      min="0"
      required
      autofocus
    />

    <label for="observacion">Observación</label>
    <input
      type="text"
      id="observacion"
      name="observacion"
      placeholder="Ej: Pago parcial en efectivo"
    />

    <div class="form-acciones">
      <button type="submit" class="btn-nuevo btn-pagar">Registrar cobro</button>
      <button
        class="btn-nuevo"
        type="button"
        onclick="location.href = '/clientes/{{.Cliente.ID}}'"
      >
        Cancelar
      </button>
    </div>
  </form>
</main>
{{end}}
