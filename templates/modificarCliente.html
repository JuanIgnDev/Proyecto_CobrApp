{{define "contenido"}}
<div style="max-width: 520px; margin: 0 auto; padding-top: 2rem">
  {{if .Error}}
  <div id="form-error" style="margin-bottom: 1rem; text-align: center">
    <span
      class="saldo debe"
      style="
        padding: 0.5rem 1rem;
        display: inline-block;
        border-radius: var(--radius-md);
      "
    >
      {{.Error}}
    </span>
  </div>
  {{end}}

  <form
    method="POST"
    action="/clientes/{{.Cliente.ID}}/editar"
    class="form-cliente form-grid"
  >
    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Nombre/s"
      value="{{.Cliente.Nombre}}"
      autocomplete="off"
      required
    />
    <input
      type="text"
      id="apellido"
      name="apellido"
      value="{{.Cliente.Apellido}}"
      placeholder="Apellido/s"
      autocomplete="off"
      required
    />

    <input
      type="tel"
      id="telefono"
      name="telefono"
      value="{{.Cliente.Telefono}}"
      placeholder="Teléfono (opcional)"
      autocomplete="off"
    />
    <input
      type="email"
      id="email"
      name="email"
      value="{{.Cliente.Email}}"
      placeholder="Email (opcional)"
      autocomplete="off"
    />

    <div class="form-acciones-grid">
      <button class="btn-nuevo btn-hover-green" type="submit">
        + Modificar Cliente
      </button>
      <button
        class="btn-nuevo btn-hover-red"
        type="button"
        onclick="location.href = '/clientes/{{.Cliente.ID}}'"
      >
        - Cancelar
      </button>
    </div>
  </form>
</div>
{{end}}
