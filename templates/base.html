{{define "base"}}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" type="image/png" href="../static/img/icono.png" />
    <link rel="shortcut icon" href="../static/img/icono.png" />
    <title>CobrApp</title>

    <!-- Este script va acá arriba para evitar que la pantalla parpadee en blanco -->
    <script>
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <header class="cover cover--header">
      <div>
        <h1>
          <a href="/" class="logo-link">CobrApp.</a>
        </h1>
      </div>

      <div class="retoque_header_padre">
        <div class="retoque_header_hijo">
          <button id="themeToggle" class="btn-theme" title="Cambiar tema">
            <span id="themeIcon">🌙</span>
          </button>
        </div>

        <div class="retoque_header_hijo">
          <!--Aca agrego la bandeja de notificaciones en caso de estar la seision iniciada-->
          {{template "bandejaDeEntrada" .}}
        </div>
        <div class="retoque_header_hijo">
          <!--Aca agrego boton de cerrar sesion en caso de estar la seision iniciada-->
          {{block "acciones-header-cerrarSesion" .}}
          <form method="POST" action="/logout">
            <button type="submit" class="btn-nuevo">Cerrar sesión</button>
          </form>
          {{end}}
        </div>
      </div>
    </header>

    <!-- Acá se inyectan los formularios y tablas -->
    <main class="libro">
      <div class="div-sideBar">{{template "sideBar" .}}</div>
      {{block "contenido" .}}{{end}}
    </main>

    <footer class="footer-app">
      <span class="footer-logo">CobrApp.</span>
      <p>Desarrollado por Juan Ignacio Estanguet y Elias Magnoli.</p>
      <span class="footer-copy"
        >&copy; 2026 Todos los derechos reservados.</span
      >
    </footer>

    <!-- Contenedor para los Toasts -->
    <div id="toast-container"></div>

    <!-- TODOS LOS SCRIPTS VAN ACÁ ABAJO, DESPUÉS DE QUE LA PÁGINA YA CARGÓ -->
    <script>
      /* --- 0. LÓGICA DEL BOTÓN DE MODO OSCURO --- */
      const btnTheme = document.getElementById("themeToggle");
      const iconTheme = document.getElementById("themeIcon");

      if (document.documentElement.classList.contains("dark")) {
        document.body.classList.add("dark");
        iconTheme.textContent = "☀️";
      }

      btnTheme.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        document.documentElement.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          iconTheme.textContent = "☀️";
        } else {
          localStorage.setItem("theme", "light");
          iconTheme.textContent = "🌙";
        }
      });

      /* --- 1. LÓGICA DE NOTIFICACIONES TOAST --- */
      function showToast(message, isError = false) {
        const container = document.getElementById("toast-container");
        if (!container) return;

        const toast = document.createElement("div");
        toast.className = `toast ${isError ? "error" : ""}`;
        toast.innerHTML = `<span>${isError ? "❌" : "✅"}</span> <span>${message}</span>`;

        container.appendChild(toast);

        // Animación de entrada
        setTimeout(() => toast.classList.add("show"), 10);

        // Remover después de 3.5 segundos
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 400); // Esperar que termine la animación
        }, 3500);
      }

      // Leer si hay un toast pendiente guardado antes de que la página recargara.
      // Si la página recargó mostrando un error (id="form-error"), el toast
      // pendiente se descarta en vez de mostrarse como si hubiese salido bien.
      document.addEventListener("DOMContentLoaded", () => {
        const pendingToast = sessionStorage.getItem("toastMsg");
        const hayError = document.getElementById("form-error");

        if (pendingToast && !hayError) {
          showToast(pendingToast);
        }
        sessionStorage.removeItem("toastMsg"); // Limpiarlo siempre, haya error o no
      });

      /* --- 2. LÓGICA GLOBAL DE FORMULARIOS --- */
      document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", function (e) {
          // A. Spinner en el botón
          const btnSubmit = form.querySelector('button[type="submit"]');
          if (btnSubmit) {
            btnSubmit.classList.add("btn-loading");
          }

          // B. Configurar el Toast para cuando la página recargue con éxito
          if (form.action.includes("cliente_nuevo")) {
            sessionStorage.setItem("toastMsg", "Cliente creado exitosamente");
          } else if (form.action.includes("cobro_nuevo")) {
            sessionStorage.setItem(
              "toastMsg",
              "El cobro se registró correctamente",
            );
          } else if (form.action.includes("venta_nueva")) {
            sessionStorage.setItem(
              "toastMsg",
              "La venta se guardó correctamente",
            );
          } else if (form.action.includes("eliminar")) {
            sessionStorage.setItem(
              "toastMsg",
              "El cliente se eliminó correctamente",
            );
          } else if (form.action.includes("editar")) {
            sessionStorage.setItem(
              "toastMsg",
              "El cliente se modificó correctamente",
            );
          }

          // C. Limpiar la máscara de moneda antes de enviarlo a Go
          const currencyInputs = form.querySelectorAll(".input-moneda");
          currencyInputs.forEach((input) => {
            let val = input.value;
            val = val.replace(/\./g, "");
            val = val.replace(",", ".");
            input.value = val;
          });
        });
      });

      /* --- 2.5. LÓGICA DE FILTROS (RESUMEN + BUSCADOR) --- */
      const resumen = document.getElementById("resumen");
      const resumenHint = document.getElementById("resumenHint");
      const filasCliente = document.querySelectorAll(".fila-cliente");

      const filtros = { texto: "", estado: "all" };

      function actualizarListado() {
        filasCliente.forEach((fila) => {
          const nombre = (fila.dataset.nombre || "").toLowerCase();
          const coincideTexto = nombre.includes(filtros.texto);
          const coincideEstado =
            filtros.estado === "all" || fila.dataset.status === filtros.estado;
          fila.style.display = coincideTexto && coincideEstado ? "" : "none";
        });

        if (resumenHint) {
          resumenHint.textContent =
            filtros.estado === "all"
              ? ""
              : "Mostrando solo clientes filtrados. Tocá la tarjeta de nuevo para ver todos.";
        }
      }

      // Se expone para que el buscador de menuPrincipal.html la reutilice
      window.cobrappFiltroTexto = function (texto) {
        filtros.texto = texto.trim().toLowerCase();
        actualizarListado();
      };

      if (resumen) {
        const botonesResumen = resumen.querySelectorAll(".resumen-item");

        botonesResumen.forEach((btn) => {
          btn.addEventListener("click", () => {
            const filtro = btn.dataset.filter;
            filtros.estado = filtros.estado === filtro ? "all" : filtro;

            botonesResumen.forEach((b) => {
              b.classList.toggle(
                "activo",
                b.dataset.filter === filtros.estado && filtros.estado !== "all",
              );
            });

            actualizarListado();
          });
        });
      }

      /* --- 3. MÁSCARA DE MONEDA EN VIVO --- */
      document.querySelectorAll(".input-moneda").forEach((input) => {
        input.addEventListener("input", function (e) {
          // Permitir solo números y comas
          let value = this.value.replace(/[^0-9,]/g, "");
          const parts = value.split(",");
          if (parts.length > 2) {
            value = parts[0] + "," + parts.slice(1).join("");
          }
          if (parts[0]) {
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          }
          this.value = parts.join(",");
        });
      });
    </script>
  </body>
</html>
{{end}}
