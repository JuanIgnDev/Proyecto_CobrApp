{{define "contenido"}}
<main class="libro">
  <a
    href="/clientes/{{.Cliente.ID}}"
    class="btn-cancelar"
    style="display: inline-block; margin-bottom: 1rem"
    >&larr; Volver a la ficha</a
  >

  {{if .Error}}
  <p class="saldo debe" style="display: block; margin-bottom: 1rem">
    {{.Error}}
  </p>
  {{end}}

  <form
    method="POST"
    action="/clientes/{{.Cliente.ID}}/venta_nueva"
    class="form-cliente"
  >
    <label for="total">Total</label>
    <input
      type="number"
      id="total"
      name="total"
      step="0.01"
      min="0"
      required
      autofocus
    />

    <label for="descripcion">Descripción</label>
    <input
      type="text"
      id="descripcion"
      name="descripcion"
      placeholder="Ej: 2 kg de harina"
    />

    <div class="form-acciones">
      <button type="submit" class="btn-nuevo btn-pagar">Registrar venta</button>
      <button
        class="btn-nuevo"
        type="button"
        onclick="location.href = '/clientes/{{.Cliente.ID}}'"
      >
        Cancelar
      </button>
    </div>
  </form>
</main>
{{end}}
