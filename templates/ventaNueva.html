{{define "contenido"}}
<main class="libro">
  <a
    href="/clientes/{{.Cliente.ID}}"
    class="btn-cancelar btn-volver"
    >&larr; Volver a la ficha</a
  >

  {{if .Error}}
  <p id="form-error" class="saldo debe mensaje-error">
    {{.Error}}
  </p>
  {{end}}

  <form
    method="POST"
    action="/clientes/{{.Cliente.ID}}/venta_nueva"
    class="form-cliente"
  >
    <label for="total">Total</label>
    <input
      type="text"
      inputmode="decimal"
      id="total"
      name="total"
      class="input-moneda"
      placeholder="0,00"
      autocomplete="off"
      required
      autofocus
    />

    <label for="descripcion">Descripción</label>
    <input
      type="text"
      id="descripcion"
      name="descripcion"
      placeholder="Ej: 2 kg de harina"
    />

    <div class="form-acciones">
      <button type="submit" class="btn-nuevo btn-pagar">Registrar venta</button>
      <button
        class="btn-nuevo"
        type="button"
        onclick="location.href = '/clientes/{{.Cliente.ID}}'"
      >
        Cancelar
      </button>
    </div>
  </form>
</main>
{{end}}
