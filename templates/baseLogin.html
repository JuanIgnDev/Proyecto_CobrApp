{{define "base"}}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" type="image/png" href="../static/img/icono.png" />
    <link rel="shortcut icon" href="../static/img/icono.png" />
    <title>CobrApp</title>

    <script>
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <header class="cover cover--header">
      <div class="header-izq">
        <h1>
          <a href="/" class="logo-link">CobrApp.</a>
        </h1>
      </div>

      <div class="header-der">
        <button id="themeToggle" class="btn-icon" title="Cambiar tema">
          <span id="themeIcon"></span>
        </button>
      </div>
    </header>

    <main class="libro">{{block "contenido" .}}{{end}}</main>
    
    <footer class="footer-app">
      <span class="footer-logo">CobrApp.</span>
      <p>Desarrollado por Juan Ignacio Estanguet y Elias Magnoli.</p>
      <span class="footer-copy">&copy; 2026 Todos los derechos reservados.</span>
    </footer>

    <script>
      const btnTheme = document.getElementById("themeToggle");
      const iconTheme = document.getElementById("themeIcon");

      const iconMoon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
      const iconSun = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;

      if (document.documentElement.classList.contains("dark")) {
        document.body.classList.add("dark");
        iconTheme.innerHTML = iconSun;
      } else {
        iconTheme.innerHTML = iconMoon;
      }

      btnTheme.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        document.documentElement.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          iconTheme.innerHTML = iconSun;
        } else {
          localStorage.setItem("theme", "light");
          iconTheme.innerHTML = iconMoon;
        }
      });
    </script>
  </body>
</html>
{{end}}
